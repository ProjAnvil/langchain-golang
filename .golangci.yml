version: "2"
linters:
  default: standard
  enable:
    - copyloopvar
    - misspell
    - unconvert
  settings:
    staticcheck:
      checks: ["all", "-QF*"]
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - errcheck
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
